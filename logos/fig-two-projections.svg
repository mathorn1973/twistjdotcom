<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" role="img" aria-label="One J, two projections: the phase forgets, the modulus remembers" font-size="13"><defs><marker id="proj-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#454545"/></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1c1c1c">One J, two projections: the phase forgets, the modulus remembers</text><g><rect x="230" y="48" width="300" height="60" rx="8" fill="#b4532a" fill-opacity="0.12" stroke="#b4532a" stroke-width="2"/><text x="380" y="72" text-anchor="middle" font-weight="600" fill="#1c1c1c">J = 1 + j² = j · φ⁻¹</text><text x="380" y="94" text-anchor="middle" font-size="11.5" fill="#6a6a6a">N(J) = 1, Tr J = 3, J⁵ = φ⁻⁵ [T]</text></g><g fill="none" stroke="#454545" stroke-width="1.25"><path d="M380 108V132H194V156" marker-end="url(#proj-arrow)"/><path d="M380 132H566V156" marker-end="url(#proj-arrow)"/></g><g><rect x="24" y="156" width="340" height="116" rx="8" fill="none" stroke="#454545" stroke-width="1.25"/><text x="40" y="180" font-weight="600" fill="#1c1c1c">Argument 2π/5: phase</text><text x="40" y="202" fill="#1c1c1c">torsion: j⁵ = 1, circuits forgotten [T]</text><text x="40" y="220" fill="#1c1c1c">tick 2π/5, five ticks close the cycle [T]</text><text x="40" y="238" fill="#1c1c1c">dictionary: electromagnetism, phase [D]</text><text x="40" y="256" fill="#1c1c1c">reading: light as the dial μ₅ [H]</text></g><g><rect x="396" y="156" width="340" height="116" rx="8" fill="none" stroke="#454545" stroke-width="1.25"/><text x="412" y="180" font-weight="600" fill="#1c1c1c">Modulus 1/φ: scale</text><text x="412" y="202" fill="#1c1c1c">no torsion: φ⁻ⁿ never returns, keeps n [T]</text><text x="412" y="220" fill="#1c1c1c">boost: the integer alternates E and p [T]</text><text x="412" y="238" fill="#1c1c1c">dictionary: gravity, scale [D]</text><text x="412" y="256" fill="#1c1c1c">reading: mass, inertia, the arrow [H]</text></g><text x="24" y="304" font-size="11.5" fill="#6a6a6a">[T] theorem, [D] dictionary of Canon v107, [H] reading outside the Canon</text></svg>