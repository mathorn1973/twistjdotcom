<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jad | TWIST-J</title>
<meta name="description" content="jad: a browser training node for TWIST-J language models. Train in the background. Contribute to the network.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f1eb; --bg-rgb: 244,241,235;
  --text: #2a2520; --text-bright: #1a1714;
  --accent: #8b4513; --accent-rgb: 139,69,19;
  --muted: #7a7570; --dim: #999;
  --rule: #d4cfc7; --eq-bg: #f3f0ea;
  --silver: #6b6560; --gold: #8b4513;
  --link: #6b6560; --link-hover: #8b4513;
  --panel-bg: rgba(244,241,235,0.95); --panel-border: #d4cfc7;
  --slider-track: #d4cfc7; --select-bg: #f3f0ea; --select-text: #6b6560;
  --green: #4a7a3a; --red: #a04040;
}
[data-theme="dark"] {
  --bg: #1c1915; --bg-rgb: 28,25,21;
  --text: #b8b3a8; --text-bright: #d4cfc6;
  --accent: #b08050; --accent-rgb: 176,128,80;
  --muted: #7a7268; --dim: #605850;
  --rule: #38332c; --eq-bg: #252118;
  --silver: #9a9488; --gold: #b08050;
  --link: #9a9488; --link-hover: #b08050;
  --panel-bg: rgba(28,25,21,0.95); --panel-border: #38332c;
  --slider-track: #38332c; --select-bg: #252118; --select-text: #9a9488;
  --green: #6a9955; --red: #c04040;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="dark"]) {
    --bg: #1c1915; --bg-rgb: 28,25,21;
    --text: #b8b3a8; --text-bright: #d4cfc6;
    --accent: #b08050; --accent-rgb: 176,128,80;
    --muted: #7a7268; --dim: #605850;
    --rule: #38332c; --eq-bg: #252118;
    --silver: #9a9488; --gold: #b08050;
    --link: #9a9488; --link-hover: #b08050;
    --panel-bg: rgba(28,25,21,0.95); --panel-border: #38332c;
    --slider-track: #38332c; --select-bg: #252118; --select-text: #9a9488;
    --green: #6a9955; --red: #c04040;
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow-x: hidden; }
body {
  font-family: 'Cormorant Garamond', Georgia, serif;
  background: var(--bg); color: var(--text);
  display: flex; flex-direction: column; align-items: center;
  min-height: 100vh; padding: 3rem 2rem 2rem;
  transition: background 0.4s ease, color 0.4s ease;
}

/* ── Header ── */
.header { text-align: center; margin-bottom: 2.5rem; }
.header h1 {
  font-size: 3rem; font-weight: 400; letter-spacing: 0.3em;
  color: var(--text);
}
.header h1 span { color: var(--accent); }
.header .sub {
  font-size: 1.15rem; font-weight: 400; font-style: italic;
  color: var(--muted); letter-spacing: 0.05em; margin-top: 0.3rem;
}

/* ── Panels ── */
.panel {
  background: var(--eq-bg); border: 1px solid var(--rule);
  border-radius: 6px; padding: 1.4rem 1.8rem;
  width: 100%; max-width: 560px; margin-bottom: 1rem;
}
.panel h2 {
  font-size: 0.72rem; font-weight: 600; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--dim); margin-bottom: 0.7rem;
}
.row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0.2rem 0; font-size: 0.95rem;
}
.row .label { color: var(--muted); font-weight: 400; }
.row .value { color: var(--text-bright); font-weight: 500; }
.row .value.good { color: var(--green); }
.row .value.dim { color: var(--dim); }

/* ── Controls ── */
.controls {
  display: flex; gap: 1rem; align-items: center;
  margin-top: 1rem; flex-wrap: wrap;
}
button {
  background: var(--accent); color: var(--bg);
  border: none; border-radius: 4px; padding: 0.45rem 1.4rem;
  font-family: inherit; font-size: 0.85rem; font-weight: 600;
  cursor: pointer; letter-spacing: 0.08em; transition: filter 0.2s;
}
button:disabled { background: var(--dim); cursor: not-allowed; }
button:hover:not(:disabled) { filter: brightness(1.15); }
input[type=range] { width: 100px; accent-color: var(--accent); }

/* ── Chart ── */
canvas#loss-chart {
  width: 100%; height: 140px;
  border: 1px solid var(--rule); border-radius: 4px;
  margin-top: 0.6rem;
}

/* ── Log ── */
.log {
  font-family: 'Consolas', 'Monaco', monospace;
  font-size: 0.72rem; color: var(--dim);
  max-height: 100px; overflow-y: auto;
  white-space: pre; line-height: 1.5;
  margin-top: 0.4rem;
}

/* ── Footer ── */
.footer {
  display: flex; gap: 1.5rem; align-items: center;
  padding: 2.5rem 0 1rem; font-size: 0.85rem;
}
.footer a { color: var(--dim); text-decoration: none; font-weight: 400; }
.footer a:hover { color: var(--accent); }
.footer .dot { color: var(--rule); }

/* ── Theme toggle ── */
.theme-toggle {
  position: fixed; top: 1.5rem; right: 1.5rem;
  width: 36px; height: 36px;
  border: 1px solid var(--rule); border-radius: 50%;
  background: transparent; color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 100; opacity: 0.5;
  transition: all 0.3s ease; user-select: none;
}
.theme-toggle:hover { opacity: 1; color: var(--accent); border-color: var(--accent); }
.theme-toggle svg { width: 18px; height: 18px; fill: currentColor; }

/* ── Audio toggle ── */
.audio-toggle {
  position: fixed; top: 1.5rem; right: 5rem;
  width: 36px; height: 36px;
  border: 1px solid transparent; border-radius: 50%;
  background: transparent; color: var(--muted);
  opacity: 0.5; font-size: 1.15rem;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 100; transition: all 0.3s ease; user-select: none;
}
.audio-toggle:hover { opacity: 1; color: var(--accent); }
.audio-toggle.playing { opacity: 1; color: var(--accent); border-color: var(--accent); background: var(--panel-bg); }
.audio-panel {
  position: fixed; top: 4.2rem; right: 1.5rem;
  background: var(--panel-bg); border: 1px solid var(--panel-border);
  border-radius: 8px; padding: 1rem 1.2rem; z-index: 100;
  display: flex; flex-direction: column; gap: 0.7rem; min-width: 180px;
  opacity: 0; transform: translateY(-8px);
  pointer-events: none; transition: opacity 0.3s ease, transform 0.3s ease;
}
.audio-panel.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
.audio-panel label {
  font-size: 0.82rem; color: var(--muted); display: flex;
  align-items: center; gap: 0.5rem; letter-spacing: 0.08em;
}
.audio-panel .val { font-size: 0.75rem; color: var(--dim); min-width: 2em; text-align: right; }
.audio-panel input[type="range"] { flex: 1; height: 3px; accent-color: var(--accent); }
.audio-panel select {
  background: var(--select-bg); color: var(--select-text);
  border: 1px solid var(--panel-border); border-radius: 4px;
  padding: 0.2rem 0.4rem; font-family: inherit; font-size: 0.8rem;
}
.audio-chevron {
  position: fixed; top: 3.8rem; right: 5.15rem;
  color: var(--dim); cursor: pointer; font-size: 0.9rem;
  z-index: 100; opacity: 0; transition: opacity 0.3s ease; user-select: none;
}
.audio-chevron.show { opacity: 0.5; }
.audio-chevron.show:hover { opacity: 1; color: var(--accent); }
.audio-chevron.open { transform: rotate(180deg); }

@media (max-width: 600px) {
  body { padding: 2rem 1.2rem 1.5rem; }
  .header h1 { font-size: 2.2rem; letter-spacing: 0.2em; }
  .panel { padding: 1rem 1.2rem; }
  .theme-toggle { top: 1rem; right: 1rem; }
  .audio-toggle { top: 1rem; right: 4rem; }
}
</style>
</head>

<!-- Theme toggle -->
<script>
(function(){
  const modes=['auto','light','dark'];
  const icons={
    auto:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M12 7a5 5 0 0 1 0 10z" fill="currentColor" opacity="0.4"/></svg>',
    light:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="currentColor"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>',
    dark:'<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/></svg>'
  };
  const titles={auto:'Theme: auto',light:'Theme: light',dark:'Theme: dark'};
  let cur=localStorage.getItem('twistj-theme')||'auto';
  const btn=document.getElementById('themeToggle');
  function apply(m){
    cur=m; localStorage.setItem('twistj-theme',m);
    const r=document.documentElement;
    if(m==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',m);
    btn.innerHTML=icons[m];
    btn.querySelector('svg').style.cssText='width:18px;height:18px;fill:currentColor';
    btn.title=titles[m];
  }
  btn.addEventListener('click',()=>{apply(modes[(modes.indexOf(cur)+1)%3]);});
  apply(cur);
})();
</script>

<!-- Audio engine -->
<script src="audio.js"></script>
<script>
(()=>{
  const RIFF_PRESETS={
    calm:{tempo:5,reverb:0.95,breath:0.9,silence:0.7,wander:false,seed:0,vTM:[1,1,1,1,1]},
    drift:{tempo:10,reverb:0.85,breath:0.75,silence:0.55,wander:false,seed:0,vTM:[1,1,1,1,1]},
    pulse:{tempo:15,reverb:0.6,breath:0.45,silence:0.30,wander:false,seed:500,vTM:[1,1,1,1,1]},
    storm:{tempo:25,reverb:0.4,breath:0.2,silence:0.10,wander:true,seed:1000,vTM:[1,1,1,1,1]},
    layers:{tempo:10,reverb:0.93,breath:0.5,silence:0.08,wander:false,seed:200,vTM:[1,2/3,3/2,2,1/2]},
    weave:{tempo:12,reverb:0.7,breath:0.35,silence:0.15,wander:true,seed:777,vTM:[1,5/3,3/5,4/3,3/4]}
  };
  const engine=TwistJ({tempo:10,reverb:0.85,breath:0.75,silence:0.55,wander:false});
  let playing=false;
  const btn=document.getElementById('audioToggle'),panel=document.getElementById('audioPanel');
  const volS=document.getElementById('audioVol'),volV=document.getElementById('audioVolVal');
  const spdS=document.getElementById('audioSpeed'),spdV=document.getElementById('audioSpeedVal');
  const riffS=document.getElementById('audioRiff'),chev=document.getElementById('audioChevron');
  let panelOpen=false;
  function s2b(v){return Math.round(0.5*Math.pow(360,v/100)*10)/10;}
  function b2s(b){return Math.round(100*Math.log(b/0.5)/Math.log(360));}
  function preset(n){const p=RIFF_PRESETS[n];if(!p)return;spdS.value=b2s(p.tempo);spdV.textContent=p.tempo;engine.forceAllVoices(n==='layers'||n==='weave');engine.set({reverb:p.reverb,breath:p.breath,silence:p.silence,wander:p.wander,tempo:p.tempo,vTM:p.vTM||[1,1,1,1,1]});if(playing){engine.stop();engine.forceAllVoices(n==='layers'||n==='weave');engine.start(p.seed);}}
  btn.addEventListener('click',()=>{
    if(!playing){playing=true;const ks=Object.keys(RIFF_PRESETS),rk=ks[Math.floor(Math.random()*ks.length)];riffS.value=rk;const p=RIFF_PRESETS[rk];engine.forceAllVoices(rk==='layers'||rk==='weave');engine.set({tempo:s2b(spdS.value),reverb:p.reverb,breath:p.breath,silence:p.silence,wander:p.wander,vTM:p.vTM||[1,1,1,1,1]});engine.start(p.seed);if(engine._master)engine._master.gain.setTargetAtTime((volS.value/100)*0.7,engine._ax.currentTime,0.05);btn.textContent='\u{1f50a}';btn.classList.add('playing');chev.classList.add('show');panel.classList.add('visible');chev.classList.add('open');panelOpen=true;}
    else{playing=false;engine.stop();btn.textContent='\u{1f507}';btn.classList.remove('playing');panel.classList.remove('visible');chev.classList.remove('show','open');panelOpen=false;}
  });
  chev.addEventListener('click',()=>{panelOpen=!panelOpen;panel.classList.toggle('visible',panelOpen);chev.classList.toggle('open',panelOpen);});
  volS.addEventListener('input',()=>{volV.textContent=volS.value;if(playing&&engine._master)engine._master.gain.setTargetAtTime((volS.value/100)*0.7,engine._ax.currentTime,0.05);});
  spdS.addEventListener('input',()=>{const b=s2b(spdS.value);spdV.textContent=b<10?b.toFixed(1):Math.round(b);engine.setTempo(b);});
  riffS.addEventListener('change',()=>{preset(riffS.value);});
})();
</script>

<!-- jad WASM training -->
<script src="jad.js"></script>
<script>
const $=id=>document.getElementById(id);
let Module=null,jadHandle=0,running=false,step=0,losses=[],dataPtr=null,dataLen=0,t0=0;
let jagUrl='',jagConnected=false,jagTask=null,nodeId='jad_'+Math.random().toString(36).slice(2,10);
let cfg={dim:64,ff:256,depth:4,heads:4,conv_k:4,vocab:256,batch:1,seq:128,steps:100,lr:1e-3};

function log(msg){const el=$('log');const ts=new Date().toLocaleTimeString('en',{hour12:false});el.textContent+='['+ts+'] '+msg+'\n';el.scrollTop=el.scrollHeight;}

const canvas=$('loss-chart'),ctx=canvas.getContext('2d');
function drawChart(){
  const w=canvas.width=canvas.offsetWidth*devicePixelRatio;
  const h=canvas.height=canvas.offsetHeight*devicePixelRatio;
  ctx.clearRect(0,0,w,h);
  if(losses.length<2)return;
  const mx=Math.max(...losses.slice(0,Math.min(20,losses.length)));
  const mn=Math.min(...losses);
  const rng=mx-mn||1;
  ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--accent').trim();
  ctx.lineWidth=1.5*devicePixelRatio;
  ctx.beginPath();
  for(let i=0;i<losses.length;i++){
    const x=(i/(losses.length-1))*w;
    const y=h-((losses[i]-mn)/rng)*(h*0.85)-h*0.05;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--dim').trim();
  ctx.font=`${10*devicePixelRatio}px monospace`;
  ctx.fillText(mx.toFixed(2),4,14*devicePixelRatio);
  ctx.fillText(mn.toFixed(2),4,h-4);
}

/* ---- jag connection ---- */
async function jagConnect(){
  const url=$('jag-url').value.replace(/\/$/,'');
  if(!url){log('enter jag url');return;}
  try{
    log('connecting to '+url+'...');
    const r=await fetch(url+'/api/status');
    const s=await r.json();
    jagUrl=url;jagConnected=true;
    cfg=s.config;
    $('jag-status').textContent='connected';$('jag-status').style.color='var(--green)';
    $('jag-ver').textContent='v'+s.version;
    $('jag-nodes').textContent=s.active_nodes;
    $('jag-rounds').textContent=s.total_rounds;
    $('st-config').textContent='d'+cfg.dim+' ff'+cfg.ff+' L'+cfg.depth+' H'+cfg.heads;
    $('btn-connect').textContent='disconnect';
    log('connected. model v'+s.version+', '+s.n_params+' params, '+s.n_chunks+' chunks');
  }catch(e){
    log('connection failed: '+e.message);
    $('jag-status').textContent='failed';$('jag-status').style.color='var(--red)';
  }
}
function jagDisconnect(){
  jagConnected=false;jagUrl='';jagTask=null;
  $('jag-status').textContent='disconnected';$('jag-status').style.color='var(--dim)';
  $('jag-ver').textContent='\u2014';$('jag-nodes').textContent='\u2014';$('jag-rounds').textContent='\u2014';
  $('btn-connect').textContent='connect';
  log('disconnected from jag');
}

async function jagFetchTask(){
  const r=await fetch(jagUrl+'/api/task',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({node_id:nodeId})});
  return r.json();
}

async function jagLoadModel(){
  const r=await fetch(jagUrl+'/api/model');
  const buf=await r.arrayBuffer();
  return new Float32Array(buf);
}

async function jagLoadChunk(id){
  const r=await fetch(jagUrl+'/api/chunk/'+id);
  const buf=await r.arrayBuffer();
  return new Uint8Array(buf);
}

async function jagSubmitDelta(taskId,taskToken,modelVer,stepsDone,avgLoss,tokens){
  const n=Module.ccall('jad_param_count','number',['number'],[jadHandle]);
  const ptr=Module._malloc(n*4);
  Module.ccall('jad_get_delta',null,['number','number','number'],[jadHandle,ptr,n]);
  const delta=new Float32Array(Module.HEAPF32.buffer,ptr,n);
  const blob=new Blob([new Float32Array(delta)],{type:'application/octet-stream'});
  Module._free(ptr);
  const fd=new FormData();
  fd.append('task_id',taskId);
  fd.append('task_token',taskToken);
  fd.append('steps_done',String(stepsDone));
  fd.append('avg_loss',String(avgLoss));
  fd.append('tokens',String(tokens));
  fd.append('model_version',String(modelVer));
  fd.append('delta',blob,'delta.bin');
  const r=await fetch(jagUrl+'/api/result',{method:'POST',body:fd});
  return r.json();
}

function setWeightsFromArray(arr){
  const n=arr.length;
  const ptr=Module._malloc(n*4);
  new Float32Array(Module.HEAPF32.buffer,ptr,n).set(arr);
  Module.ccall('jad_set_weights',null,['number','number','number'],[jadHandle,ptr,n]);
  Module._free(ptr);
}

function loadDataChunk(bytes){
  if(dataPtr)Module._free(dataPtr);
  dataLen=bytes.length;
  dataPtr=Module._malloc(dataLen*4);
  const iv=new Int32Array(Module.HEAP32.buffer,dataPtr,dataLen);
  for(let i=0;i<dataLen;i++)iv[i]=bytes[i];
}

/* ---- jag-coordinated training loop ---- */
async function trainLoopJag(){
  $('btn-start').disabled=true;$('btn-stop').disabled=false;running=true;

  while(running&&jagConnected){
    try{
      // 1. fetch task
      log('fetching task...');
      const task=await jagFetchTask();
      log('task: '+task.task_id+', chunk '+task.chunk_id);
      cfg=task.config;

      // 2. download model + chunk
      log('downloading model v'+task.model_version+'...');
      const weights=await jagLoadModel();
      $('st-params').textContent=(weights.length/1e3).toFixed(1)+'K';
      $('jag-ver').textContent='v'+task.model_version;

      log('downloading chunk '+task.chunk_id+'...');
      const chunk=await jagLoadChunk(task.chunk_id);

      // 3. reinit jad with new config if needed
      if(jadHandle)Module.ccall('jad_destroy',null,['number'],[jadHandle]);
      jadHandle=Module.ccall('jad_create','number',
        ['number','number','number','number','number','number','number','number'],
        [cfg.dim,cfg.ff,cfg.depth,cfg.heads,cfg.conv_k,cfg.vocab,cfg.batch,cfg.seq]);
      setWeightsFromArray(weights);
      loadDataChunk(chunk);

      // 4. train
      const stepsTarget=cfg.steps||100;
      const lr=cfg.lr||1e-3;
      let totalLoss=0;
      t0=performance.now();
      step=0;losses=[];

      log('training '+stepsTarget+' steps, lr='+lr+'...');
      for(let s=0;s<stepsTarget&&running;s++){
        const loss=Module.ccall('jad_step','number',['number','number','number','number'],[jadHandle,dataPtr,dataLen,lr]);
        step++;totalLoss+=loss;losses.push(loss);
        const bpc=loss/Math.LN2;
        const elapsed=(performance.now()-t0)/1000;
        const toks=step*cfg.batch*cfg.seq/elapsed;
        $('tr-step').textContent=step;$('tr-loss').textContent=loss.toFixed(4);
        $('tr-bpc').textContent=bpc.toFixed(2);$('tr-toks').textContent=toks.toFixed(0);
        if(step%10===0)drawChart();
        // throttle
        const pct=parseInt($('throttle').value);
        const dt=performance.now()-t0-((step-1)*cfg.batch*cfg.seq/toks*1000||0);
        const wait=Math.max(0,30*(100/pct-1));
        await new Promise(r=>setTimeout(r,wait));
      }

      // 5. submit delta
      const avgLoss=totalLoss/step;
      const tokens=step*cfg.batch*cfg.seq;
      log('submitting delta ('+step+' steps, loss '+avgLoss.toFixed(4)+')...');
      const result=await jagSubmitDelta(task.task_id,task.task_token,task.model_version,step,avgLoss,tokens);
      if(result.aggregated){
        log('round aggregated! new model v'+result.new_version+', round loss '+result.round_loss.toFixed(4));
        $('jag-ver').textContent='v'+result.new_version;
      }else{
        log('delta accepted ('+result.pending+'/'+result.need+')');
      }

      // update jag status
      try{
        const sr=await fetch(jagUrl+'/api/status');
        const ss=await sr.json();
        $('jag-nodes').textContent=ss.active_nodes;
        $('jag-rounds').textContent=ss.total_rounds;
      }catch(e){}

    }catch(e){
      log('error: '+e.message);
      await new Promise(r=>setTimeout(r,5000));
    }
  }
  $('btn-start').disabled=false;$('btn-stop').disabled=true;
}

/* ---- standalone training loop (no jag) ---- */
async function trainLoopStandalone(){
  $('btn-start').disabled=true;$('btn-stop').disabled=false;running=true;t0=performance.now();
  while(running){
    const loss=Module.ccall('jad_step','number',['number','number','number','number'],[jadHandle,dataPtr,dataLen,cfg.lr]);
    step++;losses.push(loss);
    const bpc=loss/Math.LN2;
    const elapsed=(performance.now()-t0)/1000;
    const toks=step*cfg.batch*cfg.seq/elapsed;
    $('tr-step').textContent=step;$('tr-loss').textContent=loss.toFixed(4);
    $('tr-bpc').textContent=bpc.toFixed(2);$('tr-toks').textContent=toks.toFixed(0);
    if(step%10===0)drawChart();
    if(step%50===0)log('step '+step+'  loss '+loss.toFixed(4)+'  bpc '+bpc.toFixed(2)+'  '+toks.toFixed(0)+' tok/s');
    const pct=parseInt($('throttle').value);
    const st=performance.now();
    await new Promise(r=>setTimeout(r,0));
    const dt=performance.now()-st;
    const wait=Math.max(0,30*(100/pct-1));
    await new Promise(r=>setTimeout(r,wait));
  }
  $('btn-start').disabled=false;$('btn-stop').disabled=true;
}

/* ---- init ---- */
async function init(){
  log('loading wasm...');
  try{Module=await createJadModule();log('wasm loaded');}
  catch(e){log('ERROR: '+e.message);$('st-status').textContent='failed';$('st-status').style.color='var(--red)';return;}

  jadHandle=Module.ccall('jad_create','number',
    ['number','number','number','number','number','number','number','number'],
    [cfg.dim,cfg.ff,cfg.depth,cfg.heads,cfg.conv_k,cfg.vocab,cfg.batch,cfg.seq]);
  const n=Module.ccall('jad_param_count','number',['number'],[jadHandle]);

  // Xavier init for standalone
  const ptr=Module._malloc(n*4);
  const v=new Float32Array(Module.HEAPF32.buffer,ptr,n);
  for(let i=0;i<n;i++){const u1=Math.random(),u2=Math.random();v[i]=Math.sqrt(-2*Math.log(u1+1e-30))*Math.cos(2*Math.PI*u2)*0.02;}
  Module.ccall('jad_set_weights',null,['number','number','number'],[jadHandle,ptr,n]);
  Module._free(ptr);
  $('st-params').textContent=(n/1e3).toFixed(1)+'K';

  // Standalone data
  const text=new TextEncoder().encode("The quick brown fox jumps over the lazy dog. ");
  dataLen=200000;
  dataPtr=Module._malloc(dataLen*4);
  const iv=new Int32Array(Module.HEAP32.buffer,dataPtr,dataLen);
  for(let i=0;i<dataLen;i++)iv[i]=text[i%text.length];

  log('ready. d'+cfg.dim+' ff'+cfg.ff+' L'+cfg.depth+', '+(n/1e3).toFixed(1)+'K params');
  log('standalone mode. enter jag url to join network.');
  $('st-status').textContent='ready';$('st-status').style.color='var(--green)';
  $('btn-start').disabled=false;

  // wire buttons
  $('btn-start').onclick=()=>{jagConnected?trainLoopJag():trainLoopStandalone();};
  $('btn-stop').onclick=()=>{running=false;};
  $('btn-connect').onclick=()=>{jagConnected?jagDisconnect():jagConnect();};
  $('throttle').oninput=()=>{$('throttle-val').textContent=$('throttle').value+'%';};
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden&&running){$('throttle').value=5;$('throttle-val').textContent='5%';}
  });
}
init();
</script>
