<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mandelbrot · Fractal Explorer — twistj.com</title>
<meta name="description" content="Fractal Explorer — Mandelbrot set as escape-time counting: z ↦ z² + c, time is a counter. Part of TWIST-J.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<script>
  // Apply saved theme as early as possible to avoid FOUC.
  (function(){ var t = localStorage.getItem('twistj-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  /* ── Theme: light (parchment) ── */
  :root {
    --bg: #F0EDE6;
    --canvas-bg: #FAF7F1;
    --text: #1A1A1A;
    --muted: #5C4A2E;
    --accent: #B8860B;
    --accent-hover: #8B6914;
    --rule: rgba(26, 26, 26, 0.18);
    --rule-soft: rgba(26, 26, 26, 0.06);
    --accent-glow: rgba(184, 134, 11, 0.08);
    --btn-bg: rgba(250, 247, 241, 0.92);
    --btn-border: rgba(26, 26, 26, 0.3);
    --toast-bg: rgba(26, 26, 26, 0.85);
    --toast-text: #FAF7F1;
    --toast-kbd-bg: rgba(184, 134, 11, 0.4);
    --toast-kbd-border: rgba(250, 247, 241, 0.3);
    --canvas-stroke: #1A1A1A;
    --panel-bg: rgba(250, 247, 241, 0.95);
    --panel-border: rgba(26, 26, 26, 0.18);
    --slider-track: rgba(26, 26, 26, 0.22);
    --select-bg: rgba(243, 240, 234, 0.9);
    --select-text: #5C4A2E;
  }
  /* ── Theme: dark (matches main twistj.com palette) ── */
  [data-theme="dark"] {
    --bg: #1c1915;
    --canvas-bg: #252118;
    --text: #d4cfc6;
    --muted: #9a9488;
    --accent: #b08050;
    --accent-hover: #c89066;
    --rule: rgba(212, 207, 198, 0.16);
    --rule-soft: rgba(212, 207, 198, 0.04);
    --accent-glow: rgba(176, 128, 80, 0.10);
    --btn-bg: rgba(37, 33, 24, 0.92);
    --btn-border: rgba(212, 207, 198, 0.3);
    --toast-bg: rgba(212, 207, 198, 0.92);
    --toast-text: #1c1915;
    --toast-kbd-bg: rgba(176, 128, 80, 0.4);
    --toast-kbd-border: rgba(28, 25, 21, 0.3);
    --canvas-stroke: #d4cfc6;
    --panel-bg: rgba(28, 25, 21, 0.95);
    --panel-border: rgba(212, 207, 198, 0.18);
    --slider-track: rgba(212, 207, 198, 0.22);
    --select-bg: rgba(37, 33, 24, 0.9);
    --select-text: #9a9488;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]):not([data-theme="dark"]) {
      --bg: #1c1915;
      --canvas-bg: #252118;
      --text: #d4cfc6;
      --muted: #9a9488;
      --accent: #b08050;
      --accent-hover: #c89066;
      --rule: rgba(212, 207, 198, 0.16);
      --rule-soft: rgba(212, 207, 198, 0.04);
      --accent-glow: rgba(176, 128, 80, 0.10);
      --btn-bg: rgba(37, 33, 24, 0.92);
      --btn-border: rgba(212, 207, 198, 0.3);
      --toast-bg: rgba(212, 207, 198, 0.92);
      --toast-text: #1c1915;
      --toast-kbd-bg: rgba(176, 128, 80, 0.4);
      --toast-kbd-border: rgba(28, 25, 21, 0.3);
      --canvas-stroke: #d4cfc6;
      --panel-bg: rgba(28, 25, 21, 0.95);
      --panel-border: rgba(212, 207, 198, 0.18);
      --slider-track: rgba(212, 207, 198, 0.22);
      --select-bg: rgba(37, 33, 24, 0.9);
      --select-text: #9a9488;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'EB Garamond', 'Garamond', 'Hoefler Text', Georgia, serif;
    min-height: 100vh;
    overflow-x: hidden;
    transition: background 0.4s ease, color 0.4s ease;
  }
  .app { max-width: 1200px; margin: 0 auto; padding: 44px 24px 24px; }
  header {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 14px; padding-bottom: 12px;
    border-bottom: 1px solid var(--rule);
    gap: 12px; flex-wrap: wrap;
  }
  h1 {
    font-family: 'Cinzel', 'Trajan Pro', 'Optima', serif;
    font-size: 22px; font-weight: 500; letter-spacing: 0.16em;
    margin: 0; text-transform: uppercase;
  }
  .subtitle {
    font-style: italic; font-size: 14px; margin: 4px 0 0;
    color: var(--muted); letter-spacing: 0.02em;
  }
  .info {
    font-size: 11px; font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    color: var(--muted); text-align: right; font-variant-numeric: tabular-nums;
    line-height: 1.55; letter-spacing: 0.02em;
  }
  .info b { color: var(--text); font-weight: 500; }
  .canvas-wrap {
    position: relative; background: var(--canvas-bg); border-radius: 1px;
    box-shadow: 0 1px 2px var(--rule-soft), 0 4px 28px var(--accent-glow);
    overflow: hidden; user-select: none;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  canvas.dragging { cursor: grabbing; }
  .loading {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; font-style: italic; font-size: 15px;
    color: var(--muted); letter-spacing: 0.04em; background: var(--canvas-bg); z-index: 5;
  }
  .controls {
    position: absolute; right: 14px; bottom: 14px;
    display: flex; flex-direction: column; gap: 5px;
  }
  .controls button {
    width: 36px; height: 36px;
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    color: var(--text); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s;
    border-radius: 0; padding: 0;
    font-family: 'Cinzel', serif; font-size: 18px; line-height: 1;
  }
  .controls button:hover { background: var(--accent); color: var(--canvas-bg); }
  .controls button:active { background: var(--accent-hover); }
  .controls button.on { background: var(--accent); color: var(--canvas-bg); }
  .juliabar {
    position: absolute; left: 14px; bottom: 14px;
    display: none; flex-direction: column; gap: 6px;
    background: var(--btn-bg); border: 1px solid var(--btn-border);
    padding: 10px 12px; font-size: 13px; color: var(--text);
    letter-spacing: 0.01em; max-width: 200px;
  }
  .juliabar.show { display: flex; }
  .juliabar label { display: flex; align-items: center; gap: 8px; }
  .juliabar input {
    flex: 1; width: 100%; min-width: 0;
    background: var(--canvas-bg); border: 1px solid var(--btn-border);
    color: var(--text); padding: 4px 6px; font-family: inherit; font-size: 13px;
  }
  .juliabar input:focus { outline: 1px solid var(--accent); }
  .juliabar .jhint { font-style: italic; color: var(--muted); font-size: 11px; }
  body.immersive .juliabar, body.showcase .juliabar { display: none !important; }
  #ssm, #slg { font-size: 13px; letter-spacing: -0.05em; }
  footer {
    margin-top: 14px; font-size: 13px; font-style: italic;
    color: var(--muted); line-height: 1.5; letter-spacing: 0.01em;
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
  footer .count {
    color: var(--text); font-style: normal; font-family: ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.04em;
  }

  /* back-link to main page (standard twistj.com pattern) */
  .back-link {
    position: fixed; top: 14px; left: 16px;
    color: var(--muted);
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 11px; letter-spacing: 0.08em;
    text-decoration: none; opacity: 0.65;
    transition: color 0.2s, opacity 0.2s;
    z-index: 50;
  }
  .back-link:hover { color: var(--accent); opacity: 1; }

  /* theme toggle (matches storyteller pattern, smaller) */
  .theme-toggle {
    position: fixed; top: 12px; right: 14px;
    width: 32px; height: 32px; padding: 0;
    border: 1px solid var(--btn-border); border-radius: 50%;
    background: transparent; color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 50;
    transition: all 0.2s ease; opacity: 0.6;
  }
  .theme-toggle:hover { opacity: 1; color: var(--accent); border-color: var(--accent); }
  .theme-toggle svg { width: 16px; height: 16px; fill: currentColor; }

  /* ── Audio player (matches main page pattern) ── */
  .audio-toggle {
    position: fixed; top: 12px; right: 54px;
    width: 32px; height: 32px;
    border: 1px solid transparent; border-radius: 50%;
    background: transparent; color: var(--muted);
    opacity: 0.6; font-size: 1.05rem;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 50;
    transition: all 0.3s ease; user-select: none;
  }
  .audio-toggle:hover { opacity: 1; color: var(--accent); }
  .audio-toggle.playing {
    opacity: 1; color: var(--accent);
    border-color: var(--accent); background: var(--panel-bg);
  }
  .audio-panel {
    position: fixed; top: 92px; right: 14px;
    background: var(--panel-bg); border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 0.9rem 1.1rem;
    z-index: 50;
    display: flex; flex-direction: column; gap: 0.6rem;
    min-width: 180px;
    opacity: 0; transform: translateY(-8px); pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .audio-panel.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .audio-panel label {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 0.82rem; letter-spacing: 0.12em;
    color: var(--muted); text-transform: lowercase;
    display: flex; align-items: center; justify-content: space-between;
    gap: 0.6rem;
  }
  .audio-panel label span.val {
    color: var(--text); font-size: 0.78rem;
    min-width: 2.2rem; text-align: right;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  }
  .audio-panel input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 90px; height: 3px;
    background: var(--slider-track); border-radius: 2px;
    outline: none; cursor: pointer;
  }
  .audio-panel input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 10px; height: 10px;
    border-radius: 50%; background: var(--accent); cursor: pointer;
  }
  .audio-panel input[type="range"]::-moz-range-thumb {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent); border: none; cursor: pointer;
  }
  .audio-panel select {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 0.82rem; letter-spacing: 0.08em;
    background: var(--select-bg); color: var(--select-text);
    border: 1px solid var(--panel-border); border-radius: 4px;
    padding: 3px 6px; cursor: pointer; outline: none;
  }
  .audio-panel select:focus { border-color: var(--accent); }
  .audio-chevron {
    position: fixed; top: 56px; right: 54px;
    width: 32px; height: 24px;
    text-align: center; font-size: 1.4rem; line-height: 24px;
    color: var(--accent); opacity: 0;
    cursor: pointer; z-index: 51;
    transition: all 0.3s ease; user-select: none; pointer-events: none;
  }
  .audio-chevron.show { opacity: 0.7; pointer-events: auto; }
  .audio-chevron.show:hover { opacity: 1; }
  .audio-chevron.open { transform: rotate(180deg); }

  @media (max-width: 600px) {
    .app { padding: 40px 12px 16px; }
    h1 { font-size: 18px; letter-spacing: 0.12em; }
    .subtitle { font-size: 13px; }
    .info { font-size: 10px; }
    .back-link { top: 10px; left: 12px; }
    .theme-toggle { top: 8px; right: 10px; width: 28px; height: 28px; }
    .theme-toggle svg { width: 14px; height: 14px; }
    .audio-toggle { top: 8px; right: 44px; width: 28px; height: 28px; font-size: 0.95rem; }
    .audio-chevron { top: 44px; right: 44px; width: 28px; }
    .audio-panel { top: 76px; right: 10px; min-width: 160px; padding: 0.7rem 0.9rem; }
  }

  /* immersive: hide all UI chrome, canvas fills viewport */
  body.immersive { background: var(--canvas-bg); overflow: hidden; }
  body.immersive .app { max-width: none; padding: 0; height: 100vh; }
  body.immersive header,
  body.immersive footer,
  body.immersive .controls,
  body.immersive .loading,
  body.immersive .back-link,
  body.immersive .theme-toggle,
  body.immersive .audio-toggle,
  body.immersive .audio-panel,
  body.immersive .audio-chevron { display: none !important; }
  body.immersive .canvas-wrap {
    position: fixed; inset: 0; box-shadow: none; border-radius: 0;
    width: 100vw !important; height: 100vh !important;
  }

  /* showcase: same as immersive + hides cursor + has inertia */
  body.showcase { background: var(--canvas-bg); overflow: hidden; }
  body.showcase .app { max-width: none; padding: 0; height: 100vh; }
  body.showcase header,
  body.showcase footer,
  body.showcase .controls,
  body.showcase .loading,
  body.showcase .back-link,
  body.showcase .theme-toggle,
  body.showcase .audio-toggle,
  body.showcase .audio-panel,
  body.showcase .audio-chevron { display: none !important; }
  body.showcase .canvas-wrap {
    position: fixed; inset: 0; box-shadow: none; border-radius: 0;
    width: 100vw !important; height: 100vh !important;
  }
  body.showcase canvas,
  body.showcase canvas.dragging { cursor: none !important; }

  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%);
    background: var(--toast-bg); color: var(--toast-text);
    padding: 10px 18px; font-size: 13px; letter-spacing: 0.04em;
    font-family: 'EB Garamond', serif;
    border-radius: 2px; pointer-events: none;
    opacity: 0; transition: opacity 0.4s;
    z-index: 100;
  }
  .toast.show { opacity: 1; }
  .toast kbd {
    display: inline-block; padding: 1px 6px;
    background: var(--toast-kbd-bg);
    border: 1px solid var(--toast-kbd-border);
    border-radius: 2px; font-family: 'Cinzel', serif;
    font-size: 11px; margin: 0 2px;
  }

  /* ── Demo identity overlay: full-screen presentation cards ── */
  .demo-overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    pointer-events: none;
    z-index: 90;
    opacity: 0;
    transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .demo-overlay.show { opacity: 1; }
  /* Radial vignette in page bg color — dims the Penrose pattern behind
     the text without fully hiding the periphery. Two stacked gradients:
     a deeper inner one for readability, a soft outer one for blend. */
  .demo-overlay::before {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 50% 35% at center, var(--bg) 0%, transparent 100%),
      radial-gradient(ellipse at center, var(--bg) 0%, transparent 70%);
    opacity: 0.75;
  }
  .demo-overlay-content {
    position: relative; z-index: 1;
    text-align: center;
    padding: 0 6vw;
    transform: translateY(28px) scale(0.96);
    transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .demo-overlay.show .demo-overlay-content {
    transform: translateY(0) scale(1);
  }
  .demo-overlay-label {
    font-family: 'Cinzel', 'Trajan Pro', 'Optima', serif;
    font-size: clamp(13px, 1.9vw, 22px);
    font-weight: 400;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--accent);
    padding-left: 0.5em;  /* offset trailing letter-spacing */
    margin-bottom: clamp(22px, 4vh, 48px);
    text-shadow: 0 0 30px var(--accent-glow);
  }
  .demo-overlay-eq {
    font-family: 'EB Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(38px, 7.5vw, 104px);
    letter-spacing: 0.005em;
    color: var(--text);
    line-height: 1.18;
    /* Soft halo in the page bg color so the text reads cleanly against
       busy tile patterns, in both light and dark themes. */
    text-shadow:
      0 0 14px var(--bg),
      0 0 28px var(--bg),
      0 2px 6px var(--bg);
  }
  .demo-overlay-eq sup {
    font-size: 0.55em;
    vertical-align: super;
    line-height: 0;
  }
  .demo-overlay-coords {
    display: inline-block;
    margin-left: 0.5em;
    color: var(--muted);
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-style: normal;
    font-size: 0.42em;
    letter-spacing: 0.04em;
    vertical-align: middle;
    opacity: 0.85;
  }
  @media (max-width: 600px) {
    .demo-overlay-label { letter-spacing: 0.35em; }
    .demo-overlay-eq { font-size: clamp(28px, 9vw, 56px); }
  }
</style>
</head>
<body>
<a href="/" class="back-link">&#8592; twistj.com</a>
<div class="audio-toggle" id="audioToggle" title="Toggle audio">&#x1f507;</div>
<div class="audio-panel" id="audioPanel">
  <label>volume <input type="range" id="audioVol" min="0" max="100" value="50"> <span class="val" id="audioVolVal">50</span></label>
  <label>speed <input type="range" id="audioSpeed" min="0" max="100" value="51" step="1"> <span class="val" id="audioSpeedVal">10</span></label>
  <label>riff
    <select id="audioRiff">
      <option value="calm">calm</option>
      <option value="drift" selected>drift</option>
      <option value="pulse">pulse</option>
      <option value="storm">storm</option>
      <option value="layers">layers</option>
      <option value="weave">weave</option>
    </select>
  </label>
</div>
<div class="audio-chevron" id="audioChevron" title="Toggle controls">&#x25BE;</div>
<button class="theme-toggle" id="themeToggle" title="Toggle theme: auto / light / dark" aria-label="Toggle theme">
  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
</button>
<script>
(function() {
  const modes = ['auto', 'light', 'dark'];
  const icons = {
    auto:  '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M12 7a5 5 0 0 1 0 10z" fill="currentColor" opacity="0.4"/></svg>',
    light: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="currentColor"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>',
    dark:  '<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/></svg>'
  };
  const titles = { auto: 'Theme: auto (follows system)', light: 'Theme: light', dark: 'Theme: dark' };
  let current = localStorage.getItem('twistj-theme') || 'auto';
  const btn = document.getElementById('themeToggle');
  function apply(mode) {
    current = mode;
    localStorage.setItem('twistj-theme', mode);
    if (mode === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', mode);
    btn.innerHTML = icons[mode];
    btn.title = titles[mode];
    window.dispatchEvent(new CustomEvent('twistj-theme-changed'));
  }
  btn.addEventListener('click', function() { apply(modes[(modes.indexOf(current) + 1) % modes.length]); });
  apply(current);
  // React to system theme changes when in 'auto' mode
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
      if (current === 'auto') window.dispatchEvent(new CustomEvent('twistj-theme-changed'));
    });
  }
})();
</script>
<div class="app">
  <header>
    <div>
      <h1>Mandelbrot · Fractal</h1>
      <p class="subtitle">z ↦ z² + c &nbsp;·&nbsp; čas je počítadlo úniku</p>
    </div>
    <div class="info">
      zoom · <b id="z">×1.0</b><br>
      m · <b id="mi">120</b><br>
      c · <b id="cc">−0.75 + 0.00i</b>
    </div>
  </header>
  <div class="canvas-wrap" id="wrap">
    <div class="loading" id="loading">Počítám časy úniku…</div>
    <canvas id="cv"></canvas>
    <div class="controls">
      <button id="zin"  title="přiblížit (+)">+</button>

<!-- Schumann riff audio engine (shared with /jam/) -->
<script src="audio.js"></script>
<script>
(()=>{
  const RIFF_PRESETS={
    calm:{tempo:5,reverb:0.95,breath:0.9,silence:0.7,wander:false,seed:0,vTM:[1,1,1,1,1]},
    drift:{tempo:10,reverb:0.85,breath:0.75,silence:0.55,wander:false,seed:0,vTM:[1,1,1,1,1]},
    pulse:{tempo:15,reverb:0.6,breath:0.45,silence:0.30,wander:false,seed:500,vTM:[1,1,1,1,1]},
    storm:{tempo:25,reverb:0.4,breath:0.2,silence:0.10,wander:true,seed:1000,vTM:[1,1,1,1,1]},
    layers:{tempo:10,reverb:0.93,breath:0.5,silence:0.08,wander:false,seed:200,vTM:[1,2/3,3/2,2,1/2]},
    weave:{tempo:12,reverb:0.7,breath:0.35,silence:0.15,wander:true,seed:777,vTM:[1,5/3,3/5,4/3,3/4]}
  };
  const engine=TwistJ({tempo:10,reverb:0.85,breath:0.75,silence:0.55,wander:false});
  let playing=false;
  const btn=document.getElementById('audioToggle'),panel=document.getElementById('audioPanel');
  const volS=document.getElementById('audioVol'),volV=document.getElementById('audioVolVal');
  const spdS=document.getElementById('audioSpeed'),spdV=document.getElementById('audioSpeedVal');
  const riffS=document.getElementById('audioRiff'),chev=document.getElementById('audioChevron');
  let panelOpen=false;
  function s2b(v){return Math.round(0.5*Math.pow(360,v/100)*10)/10;}
  function b2s(b){return Math.round(100*Math.log(b/0.5)/Math.log(360));}
  function preset(n){const p=RIFF_PRESETS[n];if(!p)return;spdS.value=b2s(p.tempo);spdV.textContent=p.tempo;engine.forceAllVoices(n==='layers'||n==='weave');engine.set({reverb:p.reverb,breath:p.breath,silence:p.silence,wander:p.wander,tempo:p.tempo,vTM:p.vTM||[1,1,1,1,1]});if(playing){engine.stop();engine.forceAllVoices(n==='layers'||n==='weave');engine.start(p.seed);}}
  btn.addEventListener('click',()=>{
    if(!playing){playing=true;const rk=riffS.value;const p=RIFF_PRESETS[rk];engine.forceAllVoices(rk==='layers'||rk==='weave');engine.set({tempo:s2b(spdS.value),reverb:p.reverb,breath:p.breath,silence:p.silence,wander:p.wander,vTM:p.vTM||[1,1,1,1,1]});engine.start(p.seed);if(engine._master)engine._master.gain.setTargetAtTime((volS.value/100)*0.7,engine._ax.currentTime,0.05);btn.textContent='\u{1f50a}';btn.classList.add('playing');chev.classList.add('show');panel.classList.add('visible');chev.classList.add('open');panelOpen=true;}
    else{playing=false;engine.stop();btn.textContent='\u{1f507}';btn.classList.remove('playing');panel.classList.remove('visible');chev.classList.remove('show','open');panelOpen=false;}
  });
  chev.addEventListener('click',()=>{panelOpen=!panelOpen;panel.classList.toggle('visible',panelOpen);chev.classList.toggle('open',panelOpen);});
  volS.addEventListener('input',()=>{volV.textContent=volS.value;if(playing&&engine._master)engine._master.gain.setTargetAtTime((volS.value/100)*0.7,engine._ax.currentTime,0.05);});
  spdS.addEventListener('input',()=>{const b=s2b(spdS.value);spdV.textContent=b<10?b.toFixed(1):Math.round(b);engine.setTempo(b);});
  riffS.addEventListener('change',()=>{preset(riffS.value);});
})();
</script>

<script>
(() => {
  // ===== stav pohledu =====
  const home = { cx: -0.75, cy: 0, scale: 3 };
  // Julia: pevné c laditelné zvlášť Re/Im. Vypnuto = klasický Mandelbrot.
  const julia = { on: false, cx: -0.8, cy: 0.156 };
  const view = { ...home };
  let boost = 0;                       // ruční doladění detailu nad automatiku
  const SCALE_MIN = 3e-13;             // hranice přesnosti double
  const SCALE_MAX = 6;

  // m roste plynule s hloubkou zoomu (logaritmicky)
  function mFor(scale) {
    return Math.max(60, Math.min(4000,
      Math.round(120 + 55 * Math.log2(3 / scale)) + boost));
  }

  // ===== schémata barev =====
  // každé dostane t = i/m a stín s = 1 - t^6 (stáhne tělo do černé)
  const SCHEMES = ['sepie', 'priroda', 'atol', 'strakata', 'psycho', 'pulnoc'];
  const SCHEME_NAMES = {
    sepie:   'sépie · chiaroscuro',
    priroda: 'příroda · les a hlína',
    atol:    'atol · laguna a korál',
    strakata:'strakatá · zlato, měděnka, lazur',
    psycho:  'psychedelická · spektrum',
    pulnoc:  'půlnoc'
  };
  // Paleta atolu: pevné barevné zastávky, mezi nimi lineární přechod.
  // Vnitřek (t = 1) není černý, končí v hlubinné mořské modři.
  const ATOL_STOPS = [
    [0.00, 243, 235, 213],   // korálový písek
    [0.16, 138, 217, 201],   // mělčina
    [0.34,  24, 158, 170],   // tyrkys laguny
    [0.50, 235, 171, 122],   // korálová lavice
    [0.66,  18, 121, 148],   // reef
    [0.84, 233, 130, 105],   // korál
    [1.00,  13,  54, 102]    // hlubina
  ];
  const ATOL = new Array(768);
  for (let k = 0; k < 256; k++) {
    const t = k / 255;
    let j = 0;
    while (j < ATOL_STOPS.length - 2 && t > ATOL_STOPS[j + 1][0]) j++;
    const A = ATOL_STOPS[j], B = ATOL_STOPS[j + 1];
    const u = (t - A[0]) / (B[0] - A[0]);
    for (let c = 0; c < 3; c++)
      ATOL[3 * k + c] = Math.round(A[c + 1] + (B[c + 1] - A[c + 1]) * u);
  }

  const SHADERS = {
    sepie:    (t, s, D, q) => { const v = 230 - 130*t, o = -90*t*t;
      D[q] = (v+o)*s; D[q+1] = (v-10+o*.3)*s; D[q+2] = (v-30-o)*s; },
    atol:     (t, s, D, q) => { const k = 3 * Math.min(255, (t * 255) | 0);
      D[q] = ATOL[k]; D[q+1] = ATOL[k+1]; D[q+2] = ATOL[k+2]; },
    priroda:  (t, s, D, q) => { const w = 14*t;
      D[q]   = (170-120*t+45*Math.sin(w+4.5))*s;
      D[q+1] = (205-110*t+45*Math.sin(w+0.6))*s;
      D[q+2] = (150-130*t+35*Math.sin(w+2.5))*s; },
    strakata: (t, s, D, q) => { const w = 22*t;
      D[q]   = (150+95*Math.sin(w+1.0))*s;
      D[q+1] = (140+95*Math.sin(w+2.6))*s;
      D[q+2] = (130+105*Math.sin(w+4.2))*s; },
    psycho:   (t, s, D, q) => { const w = 50*t;
      D[q]   = (128+127*Math.sin(w))*s;
      D[q+1] = (128+127*Math.sin(w+2.094))*s;
      D[q+2] = (128+127*Math.sin(w+4.188))*s; },
    pulnoc:   (t, s, D, q) => { const u = t*t;
      D[q] = (16+230*u)*s; D[q+1] = (20+150*u)*s; D[q+2] = (46+40*t)*s; }
  };
  let currentScheme = 'sepie';

  // ===== plátno =====
  const cv = document.getElementById('cv');
  const wrap = document.getElementById('wrap');
  const g = cv.getContext('2d');
  const buf = document.createElement('canvas');   // mezikrok pro adaptivní rozlišení
  const bg = buf.getContext('2d');
  const anchors = {};       // schéma -> { canvas, view }: přehledové kotvy okrajů
  function anchorKey(sch) { return (julia.on ? 'J:' : 'M:') + sch; }
  function anchorFor(sch) {
    const key = anchorKey(sch);
    if (!anchors[key]) anchors[key] = { canvas: document.createElement('canvas'), view: null };
    return anchors[key];
  }
  let W = 800, H = 600;
  let firstRenderDone = false;

  function fitSize() {
    const fullViewport = document.body.classList.contains('immersive') ||
                         document.body.classList.contains('showcase');
    let bw, bh;
    if (fullViewport) { bw = window.innerWidth; bh = window.innerHeight; wrap.style.height = ''; }
    else {
      bw = wrap.clientWidth || 800;
      bh = Math.round(bw * 3 / 4);
      wrap.style.height = bh + 'px';
    }
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.min(1920, Math.round(bw * dpr));
    H = Math.max(48, Math.round(W * bh / bw));
    cv.width = W; cv.height = H;
    requestRender(true);
  }

  // ===== render: z -> z² + c, tři násobení na krok přes (a+b)² =====
  let lastDt = 40;
  let lastM = 120;

  // Jádro běží v bazénu web workerů: snímek se dělí na vodorovné pásy
  // přes všechna jádra, hlavní vlákno nikdy neblokuje. Uvnitř tři triky:
  // 1) kardioida a period-2 bulva: vnitřek poznáme bez jediné iterace,
  // 2) Brentova detekce periody: orbita, která se opakuje, je vnitřek
  //    a smyčka končí hned, ne až na stropu m,
  // 3) klasická struktura smyčky: b první (ze starého a), žádná dočasná
  //    proměnná, zdvojení je sčítání a test úniku čte udržované T zadarmo.
  // SHADERS se serializují, jeden zdroj pravdy pro barvy.
  const workerSrc =
    'const ATOL=[' + ATOL.join(',') + '];' +
    'const SHADERS={' +
    Object.entries(SHADERS).map(([k, f]) => k + ':' + f.toString()).join(',') +
    '};' +
    'onmessage = e => {' +
    '  const { id, band, rw, rows, row0, rhT, x0, y0, sc, ky, m, scheme, jul, jx, jy } = e.data;' +
    '  const D = new Uint8ClampedArray(rw * rows * 4);' +
    '  const shade = SHADERS[scheme];' +
    '  for (let r = 0; r < rows; r++) {' +
    '    const y = y0 + (row0 + r + .5) * ky / rhT;' +
    '    const yy = y * y;' +
    '    let q = 4 * r * rw;' +
    '    for (let px = 0; px < rw; px++, q += 4) {' +
    '      const x = x0 + (px + .5) * sc / rw;' +
    '      let i = 0;' +
    '      let a, b, cx_, cy_;' +
    '      if (jul) { a = x; b = y; cx_ = jx; cy_ = jy; }' +
    '      else {' +
    '        const xq = x - 0.25, c2 = xq * xq + yy;' +
    '        if (c2 * (c2 + xq) <= 0.25 * yy ||' +
    '            (x + 1) * (x + 1) + yy <= 0.0625) { i = m; }' +
    '        a = 0; b = 0; cx_ = x; cy_ = y;' +
    '      }' +
    '      if (i < m) {' +
    '        let A = a * a, B = b * b, T = A + B;' +
    '        let ca = a, cb = b, chk = 8;' +
    '        while (T < 4 && i < m) {' +
    '          b = (a + a) * b + cy_; a = A - B + cx_;' +
    '          A = a * a; B = b * b; T = A + B;' +
    '          i++;' +
    '          if (Math.abs(a - ca) < 1e-13 && Math.abs(b - cb) < 1e-13) { i = m; break; }' +
    '          if (i === chk) { ca = a; cb = b; chk *= 2; }' +
    '        }' +
    '      }' +
    '      const t = i / m, ss = 1 - t**6;' +
    '      shade(t, ss, D, q);' +
    '      D[q + 3] = 255;' +
    '    }' +
    '  }' +
    '  postMessage({ id, band, row0, rows, rw, pix: D.buffer }, [D.buffer]);' +
    '};';
  const wUrl = URL.createObjectURL(new Blob([workerSrc], { type: 'text/javascript' }));
  const NW = Math.min(8, Math.max(2, (navigator.hardwareConcurrency || 4) - 1));
  const pool = [];
  for (let wi = 0; wi < NW; wi++) {
    const w = new Worker(wUrl);
    w.onmessage = onBand;
    pool.push(w);
  }

  // chybějící kotvu schématu tiše dopočítá vyhrazený worker,
  // aby zoom out měl kryté okraje hned po přepnutí barev v hloubce
  const anchorWorker = new Worker(wUrl);
  let anchorJob = null;
  anchorWorker.onmessage = e => {
    const { rw, rows, pix } = e.data;
    if (!anchorJob) return;
    const A = anchorFor(anchorJob.scheme);
    A.canvas.width = rw; A.canvas.height = rows;
    A.canvas.getContext('2d').putImageData(
      new ImageData(new Uint8ClampedArray(pix), rw, rows), 0, 0);
    A.view = anchorJob.view;
    anchorJob = null;
    blit();
  };
  function ensureAnchor() {
    const sch = currentScheme;
    const ak = anchorFor(sch);
    if (ak.view || (anchorJob && anchorJob.scheme === sch && anchorJob.jul === julia.on)) return;
    const os = 1.35, scale = 3;
    const cx = julia.on ? 0 : -0.75, cy = 0;
    const sc = scale * os, ky = sc * (H / W);
    const rw = 512, rh = Math.max(48, Math.round(rw * H / W));
    anchorJob = { scheme: sch, jul: julia.on, view: { cx, cy, scale: sc, k: ky, rw } };
    anchorWorker.postMessage({ id: -1, band: 0, rw, rows: rh, row0: 0, rhT: rh,
      x0: cx - sc / 2, y0: cy - ky / 2, sc, ky, m: 160, scheme: sch,
      jul: julia.on, jx: julia.cx, jy: julia.cy });
    if (julia.on) anchorJob.jul = true;
  }

  let inFlight = null;          // { id, ..., parts, left, t0 }
  let wanted = 0;               // rs další úlohy po dokončení, 0 = nic
  let jobSeq = 0;

  function render(rs) {         // asynchronně rozdej pásy bazénu
    if (inFlight) { wanted = Math.max(wanted, rs); return; }
    const os = 1.35;            // overscan kryje i celý tik kolečka ven (1.25)
    const rw = Math.max(64, Math.round(W * rs * os));
    const rh = Math.max(48, Math.round(H * rs * os));
    const { cx, cy, scale } = view;
    const m = demoState ? Math.min(mFor(scale), 650) : mFor(scale);
    const sc = scale * os, ky = sc * (H / W);
    const x0 = cx - sc / 2, y0 = cy - ky / 2;
    const id = ++jobSeq;
    inFlight = { id, cx, cy, sc, ky, rw, rh, m, scheme: currentScheme,
                 parts: [], left: NW, t0: performance.now() };
    const bandRows = Math.ceil(rh / NW);
    for (let b = 0; b < NW; b++) {
      const row0 = b * bandRows;
      const rows = Math.min(bandRows, rh - row0);
      if (rows <= 0) { inFlight.left--; continue; }
      pool[b].postMessage({ id, band: b, rw, rows, row0, rhT: rh,
                            x0, y0, sc, ky, m, scheme: currentScheme,
                            jul: julia.on, jx: julia.cx, jy: julia.cy });
    }
  }

  function onBand(e) {
    const { id, row0, rows, rw, pix } = e.data;
    if (!inFlight || inFlight.id !== id) return;
    inFlight.parts.push({ row0, rows, pix });
    if (--inFlight.left > 0) return;
    // všechny pásy doletěly: slož snímek
    const meta = inFlight; inFlight = null;
    // monotónnost kvality: dolet, který by zobrazený obraz zhrubil,
    // se zahodí, dokud starý snímek aktuální pohled stále kryje.
    // To zabíjí pulzování ostrý/hrubý/ostrý při plynulém zoomu.
    const kv = view.scale * (H / W);
    const covered = bufView &&
      bufView.cx - bufView.scale/2 <= view.cx - view.scale/2 &&
      bufView.cx + bufView.scale/2 >= view.cx + view.scale/2 &&
      bufView.cy - bufView.k/2     <= view.cy - kv/2 &&
      bufView.cy + bufView.k/2     >= view.cy + kv/2;
    const accept = !covered || meta.scheme !== bufScheme ||
      meta.rw / meta.sc >= (bufView.rw / bufView.scale) * 0.98;
    if (accept) {
      buf.width = meta.rw; buf.height = meta.rh;
      for (const p of meta.parts)
        bg.putImageData(new ImageData(new Uint8ClampedArray(p.pix), meta.rw, p.rows), 0, p.row0);
      bufView = { cx: meta.cx, cy: meta.cy, scale: meta.sc, k: meta.ky, rw: meta.rw };
      bufScheme = meta.scheme;
      if (meta.sc > 3.9) {            // přehledový snímek: kotva pro okraje
        const A = anchorFor(meta.scheme);
        A.canvas.width = buf.width; A.canvas.height = buf.height;
        A.canvas.getContext('2d').drawImage(buf, 0, 0);
        A.view = { ...bufView };
      }
      blit();
    }
    lastDt = performance.now() - meta.t0; lastM = meta.m;
    if (!firstRenderDone) {
      firstRenderDone = true;
      const l = document.getElementById('loading');
      if (l) l.style.display = 'none';
    }
    updateInfo();
    // adaptace rozlišení podle skutečného času snímku
    if (demoState) {
      if (lastDt > 75) demoState.rs = Math.max(0.1, demoState.rs * 0.92);
      else if (lastDt < 35) demoState.rs = Math.min(1, demoState.rs * 1.05);
    } else {
      if (lastDt > 100) interRS = Math.max(0.12, interRS * 0.9);
      else if (lastDt < 40) interRS = Math.min(1, interRS * 1.06);
    }
    if (wanted) { const r = wanted; wanted = 0; render(r); }
  }

  function updateInfo() {
    const zoom = 3 / view.scale;
    document.getElementById('z').textContent =
      '×' + (zoom < 1000 ? zoom.toPrecision(3) : zoom.toExponential(2));
    document.getElementById('mi').textContent = lastM;
    const dg = Math.max(3, Math.min(14, Math.ceil(-Math.log10(view.scale)) + 3));
    if (julia.on) {
      document.getElementById('cc').innerHTML =
        'c ' + fmtNum(julia.cx) + (julia.cy < 0 ? ' − ' : ' + ') + Math.abs(julia.cy) + 'i';
    } else {
      document.getElementById('cc').innerHTML =
        view.cx.toFixed(dg) + (view.cy < 0 ? ' − ' : ' + ') +
        Math.abs(view.cy).toFixed(dg) + 'i';
    }
    document.getElementById('cnt').textContent = Math.round(lastDt) + ' ms';
  }

  // ===== mezibuffer: reprojekce posledního snímku do nového pohledu =====
  let bufView = null;                 // pohled, ve kterém je buf spočítaný
  let bufScheme = '';                 // schéma toho snímku

  function edgeColor() {              // barva exteriéru schématu (t = 0)
    const D = [0, 0, 0, 0];
    SHADERS[currentScheme](0, 1, D, 0);
    return 'rgb(' + (D[0]|0) + ',' + (D[1]|0) + ',' + (D[2]|0) + ')';
  }

  // Efektivní rozlišení reprojekce: kolik z plného rozlišení by blit dal.
  // 0 znamená, že buf nepokrývá celý aktuální pohled (zoom out, posun),
  // pak se musí přepočítat vždy, jinak by okraje zůstaly prázdné.
  function blitQuality() {
    if (!bufView) return 0;
    const kv = view.scale * (H / W);
    const covered =
      bufView.cx - bufView.scale/2 <= view.cx - view.scale/2 &&
      bufView.cx + bufView.scale/2 >= view.cx + view.scale/2 &&
      bufView.cy - bufView.k/2     <= view.cy - kv/2 &&
      bufView.cy + bufView.k/2     >= view.cy + kv/2;
    if (!covered) return 0;
    return (bufView.rw / bufView.scale) * (view.scale / W);
  }

  function project(img, v) {        // reprojekce snímku do aktuálního pohledu
    const kv = view.scale * (H / W);
    const dx = (v.cx - v.scale/2 - (view.cx - view.scale/2)) / view.scale * W;
    const dy = (v.cy - v.k/2     - (view.cy - kv/2))         / kv * H;
    g.drawImage(img, dx, dy, v.scale / view.scale * W, v.k / kv * H);
  }
  function blit() {
    if (!bufView) return;
    g.imageSmoothingEnabled = true;
    g.fillStyle = edgeColor();
    g.fillRect(0, 0, W, H);
    // kotva pod aktuálním snímkem: odkryté okraje ukážou hrubý fraktál,
    // ne prázdnou barvu; při krytém pohledu je neviditelná
    const A = anchors[anchorKey(currentScheme)];
    if (A && A.view) project(A.canvas, A.view);
    project(buf, bufView);
  }

  // ===== plánování: blit každý snímek, výpočty asynchronně ve workeru =====
  let queued = false, interRS = 0.4, refineT = null;
  function requestRender(interactive) {
    if (!interactive) { render(1); return; }
    if (!queued) {
      queued = true;
      requestAnimationFrame(() => { queued = false; blit(); });
    }
    render(interRS);            // in-flight fronta workeru drží tempo sama
    scheduleRefine();
  }
  function scheduleRefine() {
    if (refineT) clearTimeout(refineT);
    refineT = setTimeout(() => { if (!demoState) render(1); }, 200);
    syncHash();
  }

  // ===== interakce =====
  function clampScale(s) { return Math.max(SCALE_MIN, Math.min(SCALE_MAX, s)); }
  function pos(e) {
    const r = cv.getBoundingClientRect();
    return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height];
  }
  function zoomAt(mx, my, f) {
    const k1 = view.scale * (H / W);
    const ux = view.cx + (mx / W - .5) * view.scale;
    const uy = view.cy + (my / H - .5) * k1;
    view.scale = clampScale(view.scale * f);
    const k2 = view.scale * (H / W);
    view.cx = ux - (mx / W - .5) * view.scale;
    view.cy = uy - (my / H - .5) * k2;
    requestRender(true);
  }

  cv.addEventListener('wheel', e => {
    e.preventDefault();
    if (demoState) { stopDemo(); return; }
    const [mx, my] = pos(e);
    zoomAt(mx, my, e.deltaY < 0 ? 0.8 : 1.25);
  }, { passive: false });

  cv.addEventListener('dblclick', e => {
    if (demoState) { stopDemo(); return; }
    const [mx, my] = pos(e);
    zoomAt(mx, my, 0.5);
  });

  // drag = posun (náhled posouvá hotový snímek, přepočet po puštění); 2 prsty = pinch
  let drag = null;
  const ptrs = new Map();
  let pinchPrev = null;

  cv.addEventListener('pointerdown', e => {
    if (demoState) { stopDemo(); return; }
    cv.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, pos(e));
    if (ptrs.size === 1) {
      const [mx, my] = pos(e);
      drag = { mx, my, cx: view.cx, cy: view.cy };
      cv.classList.add('dragging');
    } else { drag = null; pinchPrev = null; }
  });

  cv.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, pos(e));
    if (ptrs.size === 2) {
      const [p1, p2] = [...ptrs.values()];
      const d = Math.hypot(p1[0] - p2[0], p1[1] - p2[1]);
      const mid = [(p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2];
      if (pinchPrev) zoomAt(mid[0], mid[1], pinchPrev / d);
      pinchPrev = d;
      return;
    }
    if (!drag) return;
    const [mx, my] = pos(e);
    const dx = mx - drag.mx, dy = my - drag.my;
    view.cx = drag.cx - dx / W * view.scale;
    view.cy = drag.cy - dy / H * view.scale * (H / W);
    requestRender(true);
  });

  function endPointer(e) {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinchPrev = null;
    if (drag && ptrs.size === 0) {
      drag = null; cv.classList.remove('dragging');
      requestRender(true);
    }
  }
  cv.addEventListener('pointerup', endPointer);
  cv.addEventListener('pointercancel', endPointer);

  // ===== toast =====
  const toastEl = document.getElementById('toast');
  let toastTimer = null;
  function showToast(html, ms) {
    if (!toastEl) return;
    toastEl.innerHTML = html;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms || 1800);
  }

  // ===== immersive (H) a fullscreen (F) =====
  function fsEl() { return document.fullscreenElement || document.webkitFullscreenElement; }
  function enterFS() {
    const el = document.documentElement;
    const r = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (r) try { r.call(el).catch(() => {}); } catch (e) {}
  }
  function exitFS() {
    const x = document.exitFullscreen || document.webkitExitFullscreen;
    if (fsEl() && x) try { x.call(document).catch(() => {}); } catch (e) {}
  }
  function toggleImmersive() {
    document.body.classList.remove('showcase');
    const was = document.body.classList.contains('immersive');
    document.body.classList.toggle('immersive');
    fitSize();
    if (!was) showToast('<kbd>H</kbd> · <kbd>Esc</kbd> &nbsp; ven', 1600);
  }
  function toggleFullscreen() {
    if (fsEl()) { exitFS(); }
    else {
      document.body.classList.remove('showcase');
      document.body.classList.add('immersive');
      enterFS();
      fitSize();
      showToast('<kbd>F</kbd> · <kbd>Esc</kbd> &nbsp; ven', 1600);
    }
  }
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(ev =>
    document.addEventListener(ev, () => {
      if (!fsEl()) {
        if (demoState) { stopDemo(); }
        else { document.body.classList.remove('immersive', 'showcase'); }
      }
      fitSize();
    }));

  // ===== demo: fullscreen + ambientní dron + auto kamera po zastávkách =====
  let demoState = null;


  // Riff-player state helpers: gating zvuku v demu řídí stav riff přehrávače.
  function isRiffPlaying() {
    const b = document.getElementById('audioToggle');
    return !!(b && b.classList.contains('playing'));
  }
  function toggleRiff() {
    const b = document.getElementById('audioToggle');
    if (b) b.click();
  }

  // Zastávky prohlídky: pojmenovaná místa hranice, hloubka v bezpečí double.
  const DEMO_STOPS = [
    { x: -0.74548,   y: 0.11669,   minS: 4e-4, name: 'údolí mořských koníků' },
    { x:  0.28443,   y: 0.01273,   minS: 5e-4, name: 'sloní údolí' },
    { x: -1.7687773, y: 0.0017384, minS: 3e-4, name: 'mini Mandelbrot' },
    { x: -0.7436439, y: 0.1318259, minS: 2e-4, name: 'Misiurewiczova spirála' },
    { x: -0.15920,   y: 1.03275,   minS: 6e-4, name: 'anténa' },
    { x: -0.7269,    y: 0.1889,    minS: 5e-4, name: 'dvojitá spirála' }
  ];
  // Prohlídka jedné zastávky jako úseky: průlet se zastaveními,
  // na každé pauze se jednou vykreslí detailní snímek v plném rozlišení.
  // f = podíl hloubky v ln škále (0 přehled, 1 dno zastávky).
  const DEMO_LEGS = [
    { type: 'pan',  dur: 3 },
    { type: 'zoom', dur: 9,  from: 0,    to: 0.45 },
    { type: 'hold', dur: 4,  at: 0.45 },
    { type: 'zoom', dur: 8,  from: 0.45, to: 0.8 },
    { type: 'hold', dur: 4,  at: 0.8 },
    { type: 'zoom', dur: 6,  from: 0.8,  to: 1 },
    { type: 'hold', dur: 8,  at: 1 },
    { type: 'zoom', dur: 7,  from: 1,    to: 0.5 },
    { type: 'hold', dur: 3,  at: 0.5 },
    { type: 'zoom', dur: 8,  from: 0.5,  to: 0 }
  ];
  const DEMO_TOTAL = DEMO_LEGS.reduce((a, l) => a + l.dur, 0);

  function demoStep(now) {
    if (!demoState) return;
    const st = demoState;
    let t = (now - st.t0) / 1000;
    if (t >= DEMO_TOTAL) {
      st.prev = DEMO_STOPS[st.stopIdx];
      st.stopIdx = (st.stopIdx + 1) % DEMO_STOPS.length;
      st.t0 = now; t = 0;
      currentScheme = SCHEMES[(SCHEMES.indexOf(currentScheme) + 1) % SCHEMES.length];
      ensureAnchor();
    }
    const cur = DEMO_STOPS[st.stopIdx];
    const sm = u => u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);

    // najdi aktuální úsek prohlídky
    let legIdx = 0, tAcc = 0;
    while (legIdx < DEMO_LEGS.length - 1 && t >= tAcc + DEMO_LEGS[legIdx].dur) {
      tAcc += DEMO_LEGS[legIdx].dur; legIdx++;
    }
    const leg = DEMO_LEGS[legIdx], u = (t - tAcc) / leg.dur;

    let f = 0, cxT = cur.x, cyT = cur.y;
    if (leg.type === 'pan') {
      const w = sm(u), pv = st.prev;
      cxT = pv.x + (cur.x - pv.x) * w;
      cyT = pv.y + (cur.y - pv.y) * w;
    } else if (leg.type === 'zoom') {
      f = leg.from + (leg.to - leg.from) * sm(u);
    } else {
      f = leg.at;
    }
    const ln3 = Math.log(3);
    view.scale = Math.exp(ln3 + (Math.log(cur.minS) - ln3) * f);
    view.cx = cxT; view.cy = cyT;

    if (leg.type === 'hold') {
      // přestávka: jednou zadej detail v plném rozlišení, blit ho ukáže
      if (st.holdLeg !== legIdx) { render(1); st.holdLeg = legIdx; }
      blit();
    } else {
      st.holdLeg = -1;
      if (st.rs > blitQuality() * 1.3) render(st.rs);
      blit();                         // pohyb jede vždy přes reprojekci
    }
    st.raf = requestAnimationFrame(demoStep);
  }

  function startDemo() {
    if (demoState) return;
    enterFS();
    document.body.classList.remove('immersive');
    document.body.classList.add('showcase');
    fitSize();

    // Zvuk v demu je defaultně zapnutý: hraje hlavní riff engine
    // (preset zvolený v přehrávači, default drift). Když už hrál,
    // necháme ho; když ne, zapneme a po konci dema zase vypneme.
    const audioStarted = !isRiffPlaying();
    if (audioStarted) toggleRiff();

    demoState = {
      audioStarted,
      stopIdx: 0,
      prev: { x: home.cx, y: home.cy },
      t0: performance.now(),
      rs: 0.45,
      holdLeg: -1,
      raf: 0
    };
    demoState.raf = requestAnimationFrame(demoStep);
  }

  function stopDemo() {
    if (!demoState) return;
    cancelAnimationFrame(demoState.raf);
    const audioStarted = demoState.audioStarted;
    demoState = null;
    document.body.classList.remove('showcase', 'immersive');
    exitFS();
    Object.assign(view, home);
    fitSize();
    render(1);
    if (audioStarted && isRiffPlaying()) toggleRiff();
    syncHash();
  }
  function toggleDemo() { if (demoState) stopDemo(); else startDemo(); }

  // ===== schéma barev =====
  function cycleScheme() {
    currentScheme = SCHEMES[(SCHEMES.indexOf(currentScheme) + 1) % SCHEMES.length];
    showToast('schéma · ' + SCHEME_NAMES[currentScheme], 2200);
    ensureAnchor();
    if (!demoState) { render(1); syncHash(); }
  }

  // ===== sdílení stavu v adrese (vzor /evo) =====
  // hash nese přesnou polohu, zoom, detail, schéma a nastavení playeru
  let wantAudio = false;
  function encodeState() {
    const p = new URLSearchParams();
    p.set('x', String(view.cx));            // String() = nejkratší přesný zápis
    p.set('y', String(view.cy));
    p.set('s', String(Number(view.scale.toPrecision(6))));
    if (boost) p.set('b', String(boost));
    if (julia.on) {                         // počáteční c, jen v Julia režimu
      p.set('j', '1');
      p.set('jr', String(julia.cx));
      p.set('ji', String(julia.cy));
    }
    if (currentScheme !== 'sepie') p.set('c', currentScheme);
    if (isRiffPlaying()) p.set('a', '1');
    const r = document.getElementById('audioRiff');
    if (r && r.value !== 'drift') p.set('r', r.value);
    const v = document.getElementById('audioVol');
    if (v && v.value !== '50') p.set('v', v.value);
    const sp = document.getElementById('audioSpeed');
    if (sp && sp.value !== '51') p.set('p', sp.value);
    return p.toString();
  }
  function applyHash() {
    const h = location.hash.slice(1);
    if (!h) return false;
    const p = new URLSearchParams(h);
    let any = false;
    const fx = parseFloat(p.get('x')), fy = parseFloat(p.get('y')), fs = parseFloat(p.get('s'));
    if (isFinite(fx)) { view.cx = fx; any = true; }
    if (isFinite(fy)) { view.cy = fy; any = true; }
    if (isFinite(fs)) { view.scale = clampScale(fs); any = true; }
    const fb = parseInt(p.get('b'), 10);
    if (isFinite(fb)) boost = fb;
    // počáteční c: zpětně kompatibilní, bez klíče j zůstává Mandelbrot
    const jr = parseFloat(p.get('jr')), ji = parseFloat(p.get('ji'));
    if (isFinite(jr)) julia.cx = jr;
    if (isFinite(ji)) julia.cy = ji;
    julia.on = p.get('j') === '1';
    const c = p.get('c');
    if (c && SHADERS[c]) currentScheme = c;
    const r = p.get('r'), rs = document.getElementById('audioRiff');
    if (r && rs && [...rs.options].some(o => o.value === r)) {
      rs.value = r;
      rs.dispatchEvent(new Event('change', { bubbles: true }));
    }
    for (const [k, id] of [['v', 'audioVol'], ['p', 'audioSpeed']]) {
      const val = p.get(k), el = document.getElementById(id);
      if (val !== null && el) {
        el.value = Math.max(+el.min, Math.min(+el.max, +val));
        el.dispatchEvent(new Event('input', { bubbles: true }));
      }
    }
    if (p.get('a') === '1') wantAudio = true;
    return any;
  }
  let hashT = null;
  function syncHash() {                     // tiché zrcadlení stavu do adresy
    if (hashT) clearTimeout(hashT);
    hashT = setTimeout(() => {
      if (demoState) return;
      try { history.replaceState(null, '', '#' + encodeState()); } catch (e) {}
    }, 800);
  }
  function shareURL() {
    const url = location.origin + location.pathname + '#' + encodeState();
    try { history.replaceState(null, '', '#' + encodeState()); } catch (e) {}
    const ok = () => showToast('odkaz zkopírován', 1800);
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = url;
      ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      let done = false;
      try { done = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      if (done) ok(); else prompt('Zkopíruj odkaz:', url);
    };
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(url).then(ok).catch(fallback);
    else fallback();
  }
  // zvuk ze sdíleného odkazu: prohlížeč chce gesto, spustí ho první dotyk
  function armAudioStart() {
    const go = () => {
      if (wantAudio && !isRiffPlaying()) toggleRiff();
      wantAudio = false;
      ['pointerdown', 'keydown', 'wheel'].forEach(ev =>
        window.removeEventListener(ev, go, true));
    };
    ['pointerdown', 'keydown', 'wheel'].forEach(ev =>
      window.addEventListener(ev, go, true));
  }
  window.addEventListener('hashchange', () => {
    if (applyHash()) requestRender(true);
  });
  ['audioVol', 'audioSpeed', 'audioRiff'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', syncHash);
  });
  const at = document.getElementById('audioToggle');
  if (at) at.addEventListener('click', syncHash);

  // ===== Julia: pevné c, pixel je z0 =====
  const JULIA_HOME = { cx: 0, cy: 0, scale: 3 };   // Julia množina sedí kolem 0
  function homeView() { return julia.on ? JULIA_HOME : home; }
  function fmtNum(v) {                              // krátký, ale přesný zápis
    const s = String(v);
    return s.length > 12 ? Number(v.toPrecision(8)).toString() : s;
  }
  function refreshJuliaInputs() {
    const re = document.getElementById('jRe'), im = document.getElementById('jIm');
    if (re) re.value = fmtNum(julia.cx);
    if (im) im.value = fmtNum(julia.cy);
  }
  function setJulia(on, keepView) {
    const was = julia.on;
    julia.on = on;
    document.getElementById('jul').classList.toggle('on', on);
    document.getElementById('juliabar').classList.toggle('show', on);
    if (was !== on && !keepView) { Object.assign(view, homeView()); boost = 0; }
    ensureAnchor();
    requestRender(true);
    syncHash();
  }
  function toggleJulia() {
    setJulia(!julia.on);
    showToast(julia.on
      ? 'Julia · c = ' + fmtNum(julia.cx) + (julia.cy < 0 ? ' − ' : ' + ') + Math.abs(julia.cy) + 'i'
      : 'Mandelbrot', 2200);
  }
  function commitJuliaInput() {
    const re = parseFloat(document.getElementById('jRe').value.replace(',', '.'));
    const im = parseFloat(document.getElementById('jIm').value.replace(',', '.'));
    if (isFinite(re)) julia.cx = re;
    if (isFinite(im)) julia.cy = im;
    if (!julia.on) setJulia(true);
    else { ensureAnchor(); requestRender(true); syncHash(); }
  }
  ['jRe', 'jIm'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('change', commitJuliaInput);
    el.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); el.blur(); commitJuliaInput(); } });
  });
  document.getElementById('jul').addEventListener('click', toggleJulia);

  // ===== tlačítka =====
  document.getElementById('zin').addEventListener('click',  () => zoomAt(W/2, H/2, 0.6));
  document.getElementById('zout').addEventListener('click', () => zoomAt(W/2, H/2, 1/0.6));
  document.getElementById('mup').addEventListener('click',  () => { boost += 100; showToast('detail · m = ' + mFor(view.scale), 1400); requestRender(true); });
  document.getElementById('mdn').addEventListener('click',  () => { boost -= 100; showToast('detail · m = ' + mFor(view.scale), 1400); requestRender(true); });
  document.getElementById('rst').addEventListener('click',  () => { Object.assign(view, homeView()); boost = 0; requestRender(true); });
  document.getElementById('clr').addEventListener('click',  cycleScheme);
  document.getElementById('dmo').addEventListener('click',  toggleDemo);
  document.getElementById('fsb').addEventListener('click',  toggleFullscreen);
  document.getElementById('hid').addEventListener('click',  toggleImmersive);
  document.getElementById('shr').addEventListener('click',  shareURL);

  // ===== klávesnice =====
  document.addEventListener('keydown', e => {
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') {
      if (e.key === 'Escape') e.target.blur();
      return;                               // psaní do polí neřídí explorer
    }
    if (e.key === 'Escape') {
      if (demoState) { e.preventDefault(); stopDemo(); return; }
      if (document.body.classList.contains('immersive') ||
          document.body.classList.contains('showcase')) {
        document.body.classList.remove('immersive', 'showcase');
        fitSize();
      }
      return;
    }
    const k = e.key.toLowerCase();
    if (k === 'd') { e.preventDefault(); toggleDemo(); return; }
    // jakákoli další klávesa za běhu dema demo ukončí
    if (demoState) { e.preventDefault(); stopDemo(); return; }
    if (k === '+' || k === '=') zoomAt(W/2, H/2, 0.6);
    else if (k === '-') zoomAt(W/2, H/2, 1/0.6);
    else if (k === 'c') cycleScheme();
    else if (k === 'f') toggleFullscreen();
    else if (k === 'h') toggleImmersive();
    else if (k === 'r') { Object.assign(view, homeView()); boost = 0; requestRender(true); }
    else if (k === 's') shareURL();
    else if (k === 'j') toggleJulia();
  });

  // ===== start =====
  let resizeT = null;
  window.addEventListener('resize', () => {
    if (resizeT) clearTimeout(resizeT);
    resizeT = setTimeout(fitSize, 120);
  });
  applyHash();
  refreshJuliaInputs();
  document.getElementById('jul').classList.toggle('on', julia.on);
  document.getElementById('juliabar').classList.toggle('show', julia.on);
  fitSize();
  ensureAnchor();
  if (wantAudio) {
    armAudioStart();
    setTimeout(() => showToast('zvuk ze sdíleného odkazu se spustí prvním dotykem', 3200), 700);
  } else {
    setTimeout(() => showToast('<kbd>D</kbd> · demo &nbsp;·&nbsp; <kbd>C</kbd> · barvy &nbsp;·&nbsp; <kbd>F</kbd> · fullscreen &nbsp;·&nbsp; <kbd>S</kbd> · share', 2800), 700);
  }
})();
</script>
</body>
</html>
