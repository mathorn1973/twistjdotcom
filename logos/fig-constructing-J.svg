<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 384" role="img" aria-label="J = 1 + j² is a turn by a fifth of the circle and a shortening by the golden ratio" font-size="13"><defs><marker id="jg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#454545"/></marker><marker id="jg-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b4532a"/></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1c1c1c">J = 1 + j² is a turn by a fifth of the circle and a shortening by the golden ratio</text><g><circle cx="200" cy="220" r="130" fill="none" stroke="#c4c4c4" stroke-width="1.25"/><polygon points="330,220 240.2,96.4 94.8,143.6 94.8,296.4 240.2,343.6" fill="none" stroke="#c4c4c4" stroke-width="1.25" stroke-dasharray="3 4"/><circle cx="330" cy="220" r="3.5" fill="#454545"/><circle cx="240.2" cy="96.4" r="3.5" fill="#454545"/><circle cx="94.8" cy="143.6" r="3.5" fill="#454545"/><circle cx="94.8" cy="296.4" r="3.5" fill="#454545"/><circle cx="240.2" cy="343.6" r="3.5" fill="#454545"/><circle cx="200" cy="220" r="3" fill="#6a6a6a"/><text x="342" y="224" fill="#1c1c1c">1</text><text x="248" y="90" fill="#1c1c1c">j</text><text x="86" y="140" text-anchor="end" fill="#1c1c1c">j²</text><text x="86" y="312" text-anchor="end" fill="#1c1c1c">j³</text><text x="248" y="364" fill="#1c1c1c">j⁴</text><text x="184" y="238" font-size="11.5" fill="#6a6a6a">0</text></g><g fill="none"><path d="M200 220H330" stroke="#454545" stroke-width="1.5" marker-end="url(#jg-arrow)"/><path d="M330 220L224.8 143.6" stroke="#454545" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#jg-arrow)"/><path d="M200 220L224.8 143.6" stroke="#b4532a" stroke-width="2.5" marker-end="url(#jg-arrow-acc)"/><path d="M230 220A30 30 0 0 0 209.3 191.5" stroke="#b4532a" stroke-width="1.25"/></g><text x="292" y="172" fill="#6a6a6a">+ j²</text><text x="194" y="168" text-anchor="end" font-weight="600" fill="#1c1c1c">J</text><text x="238" y="206" font-size="11.5" fill="#6a6a6a">72°</text><g><text x="420" y="104" fill="#1c1c1c">j is a turn by a fifth of the circle, 72°.</text><text x="420" y="128" fill="#1c1c1c">Five turns give the whole circle: j⁵ = 1.</text><text x="420" y="162" fill="#1c1c1c">J = 1 + j²: lay 1 and j² end to end.</text><text x="420" y="186" fill="#1c1c1c">The sum points at an angle of 72°</text><text x="420" y="210" fill="#1c1c1c">and has length 2 · cos 72° = 1/φ.</text><text x="420" y="244" font-weight="600" fill="#1c1c1c">J = turn by a fifth, shorten by the golden ratio.</text><text x="420" y="272" font-size="11.5" fill="#6a6a6a">Grey pentagon: the dial 1, j, j², j³, j⁴.</text></g></svg>