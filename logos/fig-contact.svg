<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 350" role="img" aria-label="Contact: the midpoint stays, half the difference turns by 144°" font-size="13"><defs><marker id="ct-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#454545"/></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1c1c1c">Contact: the midpoint stays, half the difference turns by 144°</text><g fill="none"><circle cx="300" cy="180" r="121.7" stroke="#c4c4c4" stroke-width="1.25"/><path d="M60 310L300 180" stroke="#454545" stroke-width="1.25" marker-end="url(#ct-arrow)"/><path d="M180 160L420 200" stroke="#454545" stroke-width="1.5"/><path d="M385.3 266.7L214.7 93.3" stroke="#b4532a" stroke-width="2"/><path d="M339.5 186.6A40 40 0 0 0 271.9 151.5" stroke="#b4532a" stroke-width="1.25"/></g><g><circle cx="60" cy="310" r="3" fill="#6a6a6a"/><circle cx="300" cy="180" r="3.5" fill="#1c1c1c"/><circle cx="420" cy="200" r="4" fill="#454545"/><circle cx="180" cy="160" r="4" fill="#454545"/><circle cx="214.7" cy="93.3" r="4" fill="#b4532a"/><circle cx="385.3" cy="266.7" r="4" fill="#b4532a"/></g><text x="48" y="328" font-size="11.5" fill="#6a6a6a">0</text><text x="312" y="168" font-weight="600" fill="#1c1c1c">s</text><text x="430" y="206" fill="#1c1c1c">x</text><text x="168" y="158" text-anchor="end" fill="#1c1c1c">y</text><text x="204" y="88" text-anchor="end" font-weight="600" fill="#1c1c1c">x′</text><text x="396" y="284" font-weight="600" fill="#1c1c1c">y′</text><text x="362" y="212" font-size="11.5" fill="#6a6a6a">t</text><text x="250" y="142" text-anchor="end" font-size="11.5" fill="#6a6a6a">ρt</text><text x="322" y="128" font-size="11.5" fill="#6a6a6a">144°</text><g><text x="470" y="100" fill="#1c1c1c">The midpoint s = (x + y)/2 stands still.</text><text x="470" y="124" fill="#1c1c1c">Half the difference t turns by 144°.</text><text x="470" y="148" fill="#1c1c1c">x′ = s + ρt,  y′ = s − ρt,  ρ = j²</text><text x="470" y="182" font-weight="600" fill="#1c1c1c">|x|² + |y|² = 2|s|² + 2|t|²</text><text x="470" y="206" fill="#1c1c1c">The turn keeps |t|, the midpoint stays,</text><text x="470" y="230" fill="#1c1c1c">so the account stays the same.</text><text x="470" y="264" font-size="11.5" fill="#6a6a6a">Grey pair before, coloured after contact.</text></g></svg>